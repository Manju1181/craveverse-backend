spring.application.name=craveverse-backend

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/craveverse}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server Configuration
server.port=${PORT:8080}
app.admin.email=${ADMIN_EMAIL:upparmanju243@gmail.com}
app.admin.password=${ADMIN_PASSWORD:}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
